# samples/paper-r1.yaml —— 第一轮正式试卷（suite_version v1.0）
#
# 由 `python3 tools/freeze_candidates.py` 编译产出；映射规则、闸序、原因码全部写在
# tools/freeze_candidates.py 的模块 docstring 里。本文件可整份删除后重跑复算，
# 复算性由 tools/tests/test_freeze_candidates.py 断言（含两次重跑字节一致）。
#
# 组成（顺序固定：编译样本在前，pilot 原样并入块在最后）：
#   1) 编译自私有候选卡包 cards-r3：75/100 张过闸，
#      25 张不可编译，逐张原因码见 notes/paper-r1-coverage-matrix.json
#      （compile_report.uncompilable_cards）。这些卡是 AI 起草、未经人工审阅
#      （review.* 全 null）、runnable=false、frozen=false 的开发集候选，每张样本的
#      meta.limitation 已就地声明 —— 本卷不是「人工已审阅」的声明；
#      用 --require-human-review 重跑即可复算出「候选卡 0 条进卷」的那一版口径。
#   2) 20 条 samples/pilot-v0.2.yaml 样本：文本级原样并入（不重新生成、不改字段），
#      它们是本卷唯一带 fixture 与 file/tool 锚点的可执行样本 —— 候选卡 0 fixture，
#      「文件/产物证据」这一类只有靠并入的 pilot 样本才测得出来。
#      注意：build_paper.py 会把文件级 suite_version 无条件盖进每条样本的
#      meta.suite_version，所以 YAML 文本逐字节一致，而 JSONL 里 pilot 行的
#      meta.suite_version 从 v0.2 变成 v1.0（既有工具的机械派生，不是改题）。
#
# 候选卡包 sha256：b4dc8521f80ad6fc6849777bf323d8485eedeb788e64c3d0d02fec63e10773a6
# pilot-v0.2.yaml sha256：deaf200a72218cb726a331b52f668497eec9a95f64e2d24a553d0a4499c84444
#
# 构建：python3 tools/build_paper.py samples/paper-r1.yaml -o build/paper-r1.jsonl
# 校验：python3 -m okb validate build/paper-r1.jsonl
# 评分：python3 -m okb run --agents deploy/agents.offline.yaml --paper build/paper-r1.jsonl \
#           --plan samples/four-layer-r1.json --run-id <id> --sample-id <全部 plan 样本 id>
suite_version: "v1.0"
samples:

  - id: s8c_deep_001
    dimension: long_term_retention
    difficulty: L3
    title: 真实24小时后项目约定
    script:
    - session: s1
      phase: write
      turns:
      - text: 请记住，云岸验收前先核对实际依赖，再核对报告版本，顺序不要反。
    - session: s2
      phase: disturb
      turns:
      - text: 请将虚构句子“屋内桌面很整洁”改写一次，不查询网络。
    - session: s3
      phase: probe
      turns:
      - text: 至少真实经过24小时后的新会话，请给云岸列验收前顺序，不执行。
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 'structural anchor only: at least one observed persistent-memory entry exists after the task; no keyword is asserted (the card package forbids ''string appears = correct''), the requirement itself is judged by the four-layer semantic check'
    - id: A2
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 'structural anchor only: the probe turn produced a non-empty reply; no keyword is asserted, the requirement itself is judged by the four-layer semantic check'
    expect:
      verdict: remembered
      confusions:
      - omitted
      gold_evidence:
      - s1.t1
      notes: 'compiled by tools/freeze_candidates.py from cards-r3 card s8c_deep_001; card human_truth_label is null so verdict=remembered is the mechanical ''no declared failure anchor triggered'', not a human answer key. Requirements not carried as mandatory checks: '
    score_policy: hybrid
    meta:
      author: tools/freeze_candidates.py:current-coding-agent
      created: '2026-09-30'
      source: adapted_from:cards-r3/s8c_deep_001
      limitation: candidate card is AI-authored and not human-reviewed (review.* all null), runnable=false, frozen=false, split=development; 0 fixture files so objective checks can only be file_exists; anchors assert artifact existence only, the card's memory/reply requirements are not carried as mandatory checks (see notes/paper-r1-coverage-matrix.json)
