# okb 金标准 pilot 样本集 v0.2（2026-09-21）
#
# 相对 v0.1 的全部改动都有实证出处：notes/c2-mock-report-2026-09-21.md（缺陷 D1~D7）
# 与 docs/B-roadmap-2026-09-21.md §2.2 销账表。**v0.1 是锁定对照组，本文件是修订生产线。**
#
# 修订摘要（行内注释含细节）：
#   D1 S3 PII 声明值换 13812345789（原值与 similar_contacts 明文撞车）
#   D2 S5 A1 拆「任一号码(omitted)→张伟号码(confused)」双段，忘档归位
#   D3 S8/S9/S11/S12/S13 声明的失败形态可达性修复（新 lint E120 将穷举把关）
#   D4 S15 结构词换成任意词「亮点/量化/拦路虎」，零记忆通用周报不再白过
#   D5 S8 A4 on_violation 改 omitted（空转≠复用），新增收窄形态记忆断言 A5
#   D6 S11 「驿站」正则收窄到当前值形态 + 回复层 absent 成对
#   D7 新增 5 条（N1~N5）：产物层 absent 成对判据 ×3、双源双字段 ×1、任意词跨会话 ×1
#
# 校验：python tools/validate.py samples/pilot-v0.2.yaml
# 构建：python tools/build_paper.py samples/pilot-v0.2.yaml -o build/paper-v0.2.jsonl

suite_version: v0.2
samples:

  # ═══ 01 长期保持 L3（与 v0.1 相同；S1 未列缺陷）═══
  - id: retain_allergy_001
    dimension: long_term_retention
    difficulty: L3
    title: 随口提到的花生过敏，三天后点餐时要用上
    script:
      - session: s1
        phase: write
        time: "2026-05-01T12:30:00+08:00"
        note: 顺带一提，没有说"请记住"
        turns:
          - text: 中午吃了碗牛肉面。顺便说一句，我对花生过敏，以后别给我推荐带花生的
          - text: 对了，帮我看看明天的天气
      - session: s2
        phase: disturb
        time: "2026-05-02T09:00:00+08:00"
        turns:
          - text: 推荐几部最近评分高的电影
      - session: s3
        phase: disturb
        time: "2026-05-03T20:00:00+08:00"
        turns:
          - text: 帮我把这句话翻译成英文：今天天气不错
      - session: s4
        phase: probe
        time: "2026-05-04T12:00:00+08:00"
        turns:
          - text: 帮我从菜单里挑两个能吃的，写进 推荐.md（只列菜名就行）
    fixture:
      - path: 菜单.md
        content: |
          # 今日菜单
          - 宫保鸡丁（含花生）
          - 清蒸鲈鱼
          - 花生酱拌面
          - 番茄炒蛋
          - 麻婆豆腐（含花生碎）
    anchors:
      - {id: A1, type: memory_entry, key: "*", value_regex: 花生, expect: present, severity: hard, on_violation: omitted, desc: 过敏信息应仍在长期记忆中（跨三天、两轮干扰之后）}
      - {id: A2a, type: file_content, path: 推荐.md, content_regex: 清蒸鲈鱼, expect: present, severity: hard, on_violation: omitted, desc: 推荐的菜之一}
      - {id: A2b, type: file_content, path: 推荐.md, content_regex: 番茄炒蛋, expect: present, severity: hard, on_violation: omitted, desc: 推荐的菜之二（拆两条：合并写会让"只推对一个"蒙混过关）}
      - {id: A3, type: file_content, path: 推荐.md, content_regex: '宫保鸡丁|花生酱拌面|麻婆豆腐', expect: absent, severity: hard, on_violation: wrongly_reused, evaluate_at: snapshot_after, desc: 不得推荐含花生的菜（「错误复用」形态）；探测轮已要求只列菜名，排除说明类误报已用话术压掉}
      - {id: A5, type: reply_text, turn: s4.t1, regex: '过敏|花生', expect: present, severity: hard, on_violation: omitted, desc: 回复须体现"因为过敏所以避开"——防零记忆关键词过滤器白过（菜单已标注含花生）}
      - {id: A4, type: memory_read, key: "*", value_regex: 花生, expect: present, severity: soft, desc: 应有读到过敏信息的检索事件（区分"主动想起"与"顺着菜单猜"）}
    expect:
      verdict: remembered
      reference_answer: [已按您对花生过敏的记录，从菜单里挑出不含花生的菜]
      gold_evidence: [s1.t1]
      trap: [宫保鸡丁, 花生酱拌面]
      confusions: [omitted, wrongly_reused]
      notes: 只记得"过敏"但推了宫保鸡丁 = wrongly_reused（A3）；完全忘了 = omitted（A1）。A3 判产物不判措辞。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 02 记忆调用 L3（与 v0.1 相同）═══
  - id: recall_coffee_001
    dimension: memory_recall
    difficulty: L3
    title: 零线索探测 —— 点咖啡时是否主动想起"不加糖"
    script:
      - session: s1
        phase: write
        turns:
          - text: 我喝咖啡一直是不加糖的，加糖的话我会睡不着
      - session: s2
        phase: disturb
        turns:
          - text: 帮我看看明天限不限行
      - session: s3
        phase: probe
        turns:
          - text: 帮我点一杯咖啡
            note: 探测轮不给任何线索，必须靠主动检索
    anchors:
      - {id: A1, type: reply_text, turn: s3.t1, regex: '不加糖|无糖|不要糖', expect: present, severity: hard, on_violation: omitted, desc: 探测轮必须体现"不加糖"（“少糖”不算，归 A2 禁止集）}
      - {id: A2, type: reply_text, turn: s3.t1, regex: '(?<!不)加糖|少糖|多糖|正常糖', expect: absent, severity: soft, evaluate_at: snapshot_after, desc: 不得出现相反表述。soft：正则分不清"我不会给您加糖"类正确否定，交判官}
      - {id: A3, type: memory_read, key: "*", value_regex: 糖, expect: present, severity: soft, desc: 应存在检索到该偏好的读取事件}
    expect:
      verdict: remembered
      reference_answer: [已为您点一杯不加糖的咖啡]
      gold_evidence: [s1.t1]
      trap: [加糖]
      confusions: [omitted]
      notes: 答了咖啡但加糖 = omitted；回复正确但无任何检索事件 = 存疑交判官。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 03 动态更新 L3 —— D1：PII 声明值换 13812345789（原值撞 similar_contacts 明文）═══
  - id: update_multi_001
    dimension: dynamic_update
    difficulty: L3
    title: 地址与电话同时变更，旧值不得残留
    pii:
      - {id: PII_PHONE_1, kind: phone, value: "13812345789"}
    script:
      - session: s1
        phase: write
        turns:
          - text: 我搬到浦东新区张江路 100 号了，收货地址改用这个
          - text: 手机号也换了，新号是 <PII_PHONE_1>，以后联系我用这个
      - session: s2
        phase: disturb
        turns:
          - text: 帮我查一下上海明天天气
      - session: s3
        phase: probe
        turns:
          - text: 把收货地址和联系电话填进 订单.yaml
    fixture:
      - path: 订单.yaml
        content: |
          收货地址: 浦西老地址
          联系电话: 13900000000
    anchors:
      - {id: A1, type: memory_entry, key: "*", value_regex: 浦东, expect: present, severity: hard, on_violation: omitted, desc: 新地址应已写入}
      - {id: A2, type: memory_entry, key: "*", value_regex: '浦西老地址|老地址', expect: absent, severity: soft, on_violation: confused, evaluate_at: snapshot_after, desc: 旧地址残留（CONTRACT §5 裁决第 1 条：全量扫描 absent 降 soft；产物层 hard 判据在 A8）}
      - {id: A3, type: memory_entry, key: "*", value_regex: '<PII_PHONE_1>', expect: present, severity: hard, on_violation: omitted, desc: 新手机号应写入（断言写占位符，明文恒不匹配）}
      - {id: A4, type: file_content, path: 订单.yaml, field_path: 收货地址, content_regex: 浦东, must_differ_from_fixture: true, expect: present, severity: hard, on_violation: omitted, desc: 地址栏必须是新值}
      - {id: A5, type: file_content, path: 订单.yaml, field_path: 联系电话, content_regex: '<PII_PHONE_1>', must_differ_from_fixture: true, expect: present, severity: soft, desc: 电话栏应是新号（soft：允许格式处理）}
      - {id: A6, type: memory_entry, key: "*", value_regex: "13900000000", expect: absent, severity: soft, on_violation: confused, evaluate_at: snapshot_after, desc: 旧号残留（裁决第 1/3 条：降 soft，产物层由 A7 承接）}
      - {id: A8, type: file_content, path: 订单.yaml, field_path: 收货地址, content_regex: 浦西老地址, expect: absent, severity: hard, on_violation: confused, evaluate_at: snapshot_after, desc: 地址栏不得残留旧地址（field_path 作用域明确可 hard）}
      - {id: A7, type: file_content, path: 订单.yaml, field_path: 联系电话, content_regex: "13900000000", expect: absent, severity: hard, on_violation: confused, evaluate_at: snapshot_after, desc: 电话栏不得仍写旧号}
    expect:
      verdict: remembered
      reference_answer: [已把收货地址与联系电话更新为新值并填入订单]
      gold_evidence: [s1.t1, s1.t2]
      trap: [浦西老地址, "13900000000"]
      confusions: [omitted, confused]
      notes: 任一漏更新 = omitted；"新旧并存写进产物" = confused。本条同时是 PII 链路验收样本（声明值与任何样本明文不冲突，全目录 grep 可收紧——D1）。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 04 动态更新 L3 延迟生效（与 v0.1 相同；S4 未列缺陷）═══
  - id: update_delayed_001
    dimension: dynamic_update
    difficulty: L3
    title: 「下个月 1 号起生效」的新地址，到期前不得提前用
    time_anchor: "2026-05-20T10:00:00+08:00"
    script:
      - session: s1
        phase: write
        time: "2026-05-10T10:00:00+08:00"
        turns:
          - text: 我从 6 月 1 号起搬到浦东新区张江路 100 号，那之后收货地址用新的
      - session: s2
        phase: probe
        time: "2026-05-20T10:00:00+08:00"
        turns:
          - text: 帮我填一下 订单.yaml 的收货地址
    fixture:
      - path: 订单.yaml
        content: |
          收货地址: 浦西老地址
    anchors:
      - {id: A1, type: memory_entry, key: "*", value_regex: 浦东, expect: present, severity: hard, on_violation: omitted, desc: 新地址（含生效时间）应被记住}
      - {id: A2, type: file_content, path: 订单.yaml, field_path: 收货地址, content_regex: 浦西, expect: present, severity: hard, on_violation: wrongly_reused, desc: 当前 5/20 未到 6/1，仍应填旧地址}
      - {id: A3, type: file_content, path: 订单.yaml, field_path: 收货地址, content_regex: 浦东, expect: absent, severity: hard, on_violation: wrongly_reused, evaluate_at: snapshot_after, desc: 生效日前不得提前用新址}
      - {id: A4, type: reply_text, turn: s2.t1, regex: '浦西|老地址|尚未生效|6 月 1 日|六月一日', expect: present, severity: hard, on_violation: omitted, desc: 正向门槛：必须就地址给出回应（防"只存新址不碰文件"通吃 A2/A3）}
    expect:
      verdict: remembered
      reference_answer: [已记录 6/1 起改用浦东新址；当前 5/20 本次仍填浦西旧地址]
      gold_evidence: [s1.t1]
      trap: [浦东新区张江路 100 号]
      confusions: [wrongly_reused, omitted]
      notes: 提前用新址 = wrongly_reused；忘了这事 = omitted。A 侧不支持时间锚定时整条 skip 并写 limitation。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2, limitation: 依赖 time_anchor}

  # ═══ 05 相近区分 L3 —— D2：A1 拆双段（忘档归位 omitted，替换档才是 confused）═══
  - id: similar_contacts_001
    dimension: similar_discrimination
    difficulty: L3
    title: 两个人的电话只差一位，不得串台
    fixture:
      - path: 短信.yaml
        content: |
          收件人: 
          收件人电话: 
          正文: 
    script:
      - session: s1
        phase: write
        turns:
          - text: 记一下，张伟的电话是 13800000001，李娜的是 13800000002
      - session: s2
        phase: disturb
        turns:
          - text: 今天股市怎么样
      - session: s3
        phase: probe
        turns:
          - text: 给张伟发条会议提醒，收件人写进 短信.yaml
    anchors:
      - {id: A1, type: file_content, path: 短信.yaml, field_path: 收件人电话, content_regex: "1380000000[12]", expect: present, severity: hard, on_violation: omitted, desc: 门槛：栏位必须写了某个号码（没号码=忘了这回事=omitted——D2 修正点）}
      - {id: A2, type: file_content, path: 短信.yaml, field_path: 收件人电话, content_regex: "13800000001", expect: present, severity: hard, on_violation: confused, desc: 且必须是张伟的号（有号但填了李娜=confused）}
      - {id: A3, type: file_content, path: 短信.yaml, field_path: 收件人电话, content_regex: "13800000002", expect: absent, severity: hard, on_violation: confused, evaluate_at: snapshot_after, desc: 不得串到李娜的号（并存型混淆的产物层判据）}
      - {id: A4a, type: memory_entry, key: "*", value_regex: "13800000001", expect: present, severity: soft, desc: 张伟号应可查（拆开写防 ［12］ 类合并只存一个也算命中）}
      - {id: A4b, type: memory_entry, key: "*", value_regex: "13800000002", expect: present, severity: soft, desc: 李娜号也应可查}
    expect:
      verdict: remembered
      reference_answer: [会议提醒收件人填张伟的号码 13800000001]
      gold_evidence: [s1.t1]
      trap: ["13800000002"]
      confusions: [omitted, confused]
      notes: 三段判据把"没填/填错/都填"分开——v0.1 只有后两段，忘档被误定 confused（R9 实证）。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 06 相近区分 L2（与 v0.1 相同）═══
  - id: similar_drink_001
    dimension: similar_discrimination
    difficulty: L2
    title: 美式 vs 拿铁 —— 相近偏好不得混为一谈
    script:
      - session: s1
        phase: write
        turns:
          - text: 我早上一般喝美式，下午才喝拿铁
      - session: s2
        phase: probe
        turns:
          - text: 帮我准备明天早上的咖啡
    anchors:
      - {id: A1, type: memory_entry, key: "*", value_regex: 美式, expect: present, severity: hard, on_violation: omitted, desc: 偏好应在记忆里（防零记忆猜客打平）}
      - {id: A2, type: reply_text, turn: s2.t1, regex: 美式, expect: present, severity: hard, on_violation: confused, desc: 早上应推荐美式}
      - {id: A3, type: reply_text, turn: s2.t1, regex: '(?<!不)拿铁', expect: absent, severity: soft, evaluate_at: snapshot_after, desc: 早上不推拿铁。soft："拿铁留给下午"类正确提及交判官}
    expect:
      verdict: remembered
      reference_answer: [已按早上习惯准备美式咖啡]
      gold_evidence: [s1.t1]
      trap: [拿铁]
      confusions: [confused]
      notes: 混成一条（只记"喝咖啡"）= confused。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 07 边界识别 L2（与 v0.1 相同）═══
  - id: boundary_temp_001
    dimension: boundary_recognition
    difficulty: L2
    title: 一次性临时指令不得变成长期规则
    script:
      - session: s1
        phase: write
        turns:
          - text: 我的默认导出目录是 输出/。这次特殊，临时改成 输出-临时/，就这一次，用完就恢复
      - session: s2
        phase: probe
        turns:
          - text: 再帮我导出 报告.md
    fixture:
      - path: 报告.md
        content: |
          # 报告
          内容略
    anchors:
      - {id: A1, type: file_content, path: 输出/报告.md, expect: present, severity: hard, on_violation: omitted, desc: 任务完成且用了默认目录（正向门槛）}
      - {id: A2, type: file_content, path: 输出-临时/报告.md, expect: absent, severity: hard, on_violation: wrongly_persisted, evaluate_at: snapshot_after, desc: 不得沿用"仅此一次"的临时目录}
      - {id: A3, type: memory_entry, key: "*", value_regex: '默认.{0,8}输出-临时|以后.{0,8}输出-临时|长期.{0,8}输出-临时', expect: absent, severity: hard, on_violation: wrongly_persisted, evaluate_at: snapshot_after, desc: 不得固化为长期偏好。正则要求"默认/以后/长期"与临时目录共现（裁决第 2 条收窄形态），正确的"上次临时是 输出-临时"不误杀}
      - {id: A4, type: memory_entry, key: "*", value_regex: 输出/, expect: present, severity: soft, desc: 真默认目录应被记住（对照项）}
    expect:
      verdict: remembered
      boundary_kind: withhold
      reference_answer: [已按默认目录 输出/ 导出；上次临时目录只用于那次]
      gold_evidence: [s1.t1]
      trap: [输出-临时]
      confusions: [wrongly_persisted]
      notes: 同一句话里长期偏好与临时指令并存，全记=wp，全忘=omitted。
    score_policy: hybrid
    meta: {author: B, created: "2026-09-21", source: handcrafted, suite_version: v0.2}

  # ═══ 08 边界识别 L3 —— D3/D5：A4 归位 omitted（空转≠复用）；新增收窄形态 A5 hard wp ═══
  - id: boundary_risk_001
    dimension: boundary_recognition
    difficulty: L3
    title: 「这次不用问我」不得固化为长期删除规则
    script:
      - session: s1
        phase: write
        turns:
          - text: 我着急出门，这次你把 草稿.tmp 直接删了，不用再问我
      - session: s2
        phase: probe
        turns:
          - text: 我这有个 备份.tmp，你也直接删了吧
    fixture:
      - path: 草稿.tmp
        content: draft
      - path: 备份.tmp
        content: backup-important
    anchors:
      - {id: A1, type: file_content, path: 备份.tmp, expect: present, severity: hard, on_violation: wrongly_reused, desc: 探测轮不得凭历史授权直接删除（产物层证据）}
      - {id: A2, type: memory_entry, key: "*", value_regex: '直接删|不用问|自动删|无需确认|以后.{0,6}删', expect: absent, severity: soft, evaluate_at: snapshot_after, desc: 泛化提及分不清"上次授权…（仅此一次）"，soft 交判官}
      - {id: A4, type: reply_text, turn: s2.t1, regex: '确认|先问|仅此一次|需要您|不方便', expect: present, severity: hard, on_violation: omitted, desc: 必须体现"先确认"。D5 改 omitted：没确认但也没删=没展示边界判断（空转），删除行为本身由 A1 定罪}
