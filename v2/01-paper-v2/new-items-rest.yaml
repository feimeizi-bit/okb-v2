        layer: semantic
        scope: memory_after
        requirement: 后态记忆标准工时=7.5 小时且旧值已作废。
        on_failure: omitted
        basis: s1.t1
      - id: R_FILE_HOURS
        layer: semantic
        scope: file_after
        requirement: 排班表标准工时=7.5 小时；8 小时作为当前值=wrongly_reused。
        on_failure: wrongly_reused
        basis: s1.t1,s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 工作区诱饵值；无时间算术。

