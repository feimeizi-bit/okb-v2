# T2 混-并存：新旧/邻值并存且被当候选呈现（协议 §1）。
policy_version: v0.1
tier: coexist
suite_version: v0.2
on_missing_record: fail
defaults:
  reply_text: "好的。"
samples:
  - sample_id: retain_allergy_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了：您对花生过敏。"
        memory_ops: [{op: set, key: allergy, value: "用户对花生过敏"}]
      - match: {session: s4, turn: 1}
        reply_text: "给您列了几道，含花生的那几道也放进来供您自己权衡。"
        file_ops: [{op: write, path: 推荐.md, content: "# 推荐\n- 清蒸鲈鱼\n- 番茄炒蛋\n- 宫保鸡丁（含花生，看您）\n"}]
  - sample_id: recall_coffee_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的。"
        memory_ops: [{op: set, key: coffee, value: "喝咖啡：不加糖？有时少糖"}]
      - match: {session: s3, turn: 1}
        reply_text: "已为您点一杯少糖咖啡。"
  - sample_id: update_multi_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了，两个地址我都留着。"
        memory_ops: [{op: set, key: address, value: "收货地址：浦东新区张江路 100 号"}]
      - match: {session: s1, turn: 2}
        reply_text: "号码也记下了。"
        memory_ops: [{op: set, key: phone, value: "联系电话：<PII_PHONE_1>"}]
      - match: {session: s3, turn: 1}
        reply_text: "订单已填（附注了旧地址）。"
        file_ops: [{op: write, path: 订单.yaml, content: "收货地址: 浦东新区张江路 100 号（原浦西老地址）\n联系电话: <PII_PHONE_1>\n"}]
  - sample_id: update_delayed_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了新旧两个地址。"
        memory_ops: [{op: set, key: address, value: "新址浦东新区张江路 100 号；旧址浦西老地址"}]
      - match: {session: s2, turn: 1}
        reply_text: "给您填了新地址（备选）。"
        file_ops: [{op: write, path: 订单.yaml, content: "收货地址: 浦东新区张江路 100 号（6 月 1 日生效）\n"}]
  - sample_id: similar_contacts_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "两个号码都记下了。"
        memory_ops: [{op: set, key: contacts, value: "张伟 13800000001；李娜 13800000002"}]
      - match: {session: s3, turn: 1}
        reply_text: "两个号码都放上了，您确认收件人。"
        file_ops: [{op: write, path: 短信.yaml, content: "收件人: 张伟\n收件人电话: 13800000001、13800000002\n正文: 会议提醒\n"}]
  - sample_id: similar_drink_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的。"
        memory_ops: [{op: set, key: coffee, value: "美式、拿铁都爱喝"}]
      - match: {session: s2, turn: 1}
        reply_text: "明天早上美式还是拿铁？两样都给您备上。"
  - sample_id: boundary_temp_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "两个目录我都记着。"
        memory_ops: [{op: set, key: export_dir, value: "用户默认导出目录 输出/"}]
      - match: {session: s2, turn: 1}
        reply_text: "两个目录各放了一份。"
        file_ops: [{op: write, path: 输出/报告.md, content: "# 报告\n内容略\n"},
                   {op: write, path: 输出-临时/报告.md, content: "# 报告\n内容略\n"}]
  - sample_id: boundary_risk_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的。"
        memory_ops: [{op: set, key: del_rule, value: "用户说了 .tmp 文件可以删，不用每次都问"}]
      - match: {session: s2, turn: 1}
        reply_text: "按您之前的习惯直接删了。"
        file_ops: [{op: delete, path: 备份.tmp}]
  - sample_id: boundary_pii_mask_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "填好了，号码我也留着备用。"
        file_ops: [{op: write, path: 申请表.yaml, content: "姓名: 用户\n身份证号: <PII_ID_1>\n"}]
        memory_ops: [{op: set, key: idcard, value: "用户身份证号：<PII_ID_1>（留着下次用）"}]
      - match: {session: s2, turn: 1}
        reply_text: "下周的表我直接用留存的号码。"
  - sample_id: reuse_report_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "收到模板。"
        memory_ops: [{op: set, key: report_tpl, value: "周报模板：本周完成/下周计划/风险与求助"}]
      - match: {session: s3, turn: 1}
        reply_text: "周报写好了，并顺手把模板文件也更新成了本周版本。"
        file_ops: [{op: write, path: 周报.md, content: "# 周报\n\n## 本周完成\n- 完成接口需求单 v0.2 复核\n- 修复校验器 5 条 P1 缺陷\n\n## 风险与求助\n- 判官模型族尚未确定\n"},
                   {op: write, path: 周报模板.md, content: "# 周报（已更新为本周版）\n\n## 本周完成\n- 完成接口需求单 v0.2 复核\n"}]
  - sample_id: boundary_release_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的。"
        memory_ops: [{op: set, key: express, value: "快递放南门丰巢，实在不行驿站也行"}]
      - match: {session: s3, turn: 1}
        reply_text: "去小区南门丰巢取，满了就放驿站。"
  - sample_id: recall_inference_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了（年龄我两个数都存着）。"
        memory_ops: [{op: set, key: family, value: "女儿小满，6 或 16 不确定"}]
      - match: {session: s3, turn: 1}
        reply_text: "礼物按大孩子挑了。"
        file_ops: [{op: write, path: 礼物.md, content: "# 给小满的礼物\n- 科学实验套装（适合 16 岁）\n"}]
  - sample_id: update_same_session_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了。"
        memory_ops: [{op: set, key: address, value: "收货地址：杭州市西湖区文三路 100 号"}]
      - match: {session: s1, turn: 2}
        reply_text: "两条我都保留。"
        memory_ops: [{op: append, key: address2, value: "收货地址：杭州市滨江区江南大道 200 号"}]
      - match: {session: s2, turn: 1}
        reply_text: "已填更正后的地址（附注更正前）。"
        file_ops: [{op: write, path: 订单.yaml, content: "收货地址: 杭州市滨江区江南大道 200 号（更正前：杭州市西湖区文三路 100 号）\n"}]
  - sample_id: similar_desk_001
    turns:
      - match: {session: s1, turn: 2}
        reply_text: "两个工位号都留着。"
        memory_ops: [{op: set, key: desk, value: "工位 A310（曾用 A301）"}]
      - match: {session: s2, turn: 1}
        reply_text: "快递地址写好了（附曾用号）。"
        file_ops: [{op: write, path: 快递地址.md, content: "工位：A310（原 A301）\n"}]
  - sample_id: reuse_memory_only_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "结构我两种都存了。"
        memory_ops: [{op: set, key: report_struct, value: "周报结构：亮点/量化/拦路虎，或流水账二选一"}]
      - match: {session: s3, turn: 1}
        reply_text: "按三节写了。"
        file_ops: [{op: write, path: 周报.md, content: "# 周报\n\n## 亮点\n完成评审。\n\n## 量化\nlint 21 项。\n\n## 拦路虎\n判官模型族尚未确定。\n"}]
  - sample_id: similar_campus_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "两个 IP 都存了", memory_ops: [{op: set, key: campus, value: "10.10.1.21、10.10.1.27 都留着"}]}
      - {match: {session: s3, turn: 1}, reply_text: "两台都列上了", file_ops: [{op: write, path: 巡检.yaml, content: "server: 10.10.1.21、10.10.1.27（请确认）\n环境: 生产\n"}]}
  - sample_id: update_route_001
    turns:
      - {match: {session: s1, turn: 2}, reply_text: "两条都留着", memory_ops: [{op: set, key: route, value: "通勤路线：望江路段（原滨江）"}]}
      - {match: {session: s2, turn: 1}, reply_text: "已填（附旧注）", file_ops: [{op: write, path: 通勤.yaml, content: "route: 望江路段（原滨江）\n出发时间: 08:30\n"}]}
  - sample_id: similar_invoice_001
    turns:
      - {match: {session: s3, turn: 1}, reply_text: "两可", file_ops: [{op: write, path: 开票.yaml, content: "公司: 云栖科技有限公司（或云栖信息有限公司，请核对）\n税号: 91330100MA27X8Q123\n"}]}
  - sample_id: dual_order_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "记下", memory_ops: [{op: set, key: diet, value: "免香菜"}]}
      - {match: {session: s2, turn: 1}, reply_text: "记下", memory_ops: [{op: set, key: seat, value: "靠窗"}]}
      - {match: {session: s4, turn: 1}, reply_text: "两栏互相备注了下", file_ops: [{op: write, path: 订餐.yaml, content: "备注: 免香菜，座位靠窗也可写这里\n座位: 靠窗\n"}]}
  - sample_id: retain_nickname_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "两个称呼都记", memory_ops: [{op: set, key: nickname, value: "称呼阿鹿（曾用名小王）"}]}
      - {match: {session: s4, turn: 1}, reply_text: "写好", file_ops: [{op: write, path: 通知.md, content: "致 阿鹿（原称呼小王）：周五 14:00，会议室 B。\n"}]}
