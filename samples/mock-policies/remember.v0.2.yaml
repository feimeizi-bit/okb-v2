# T1 记：正确持久化、以末次为准、该拒的拒、产物正确。
# 创作输入白名单 = script+fixture+pii+meta（协议 §1）；本档兼作「锚点联合可满足性」见证（C-2a）。
policy_version: v0.1
tier: remember
suite_version: v0.2
on_missing_record: fail
defaults:
  reply_text: "好的。"
samples:
  - sample_id: retain_allergy_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了：您对花生过敏，之后推荐会避开花生。"
        memory_ops: [{op: set, key: allergy, value: "用户对花生过敏，推荐饮食需避开花生及含花生菜品"}]
      - match: {session: s4, turn: 1}
        reply_text: "因您对花生过敏，避开了含花生的菜，挑了清蒸鲈鱼和番茄炒蛋，写进 推荐.md。"
        file_ops: [{op: write, path: 推荐.md, content: "# 推荐\n- 清蒸鲈鱼\n- 番茄炒蛋\n"}]
  - sample_id: recall_coffee_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的，记住了：咖啡不加糖。"
        memory_ops: [{op: set, key: coffee, value: "喝咖啡不加糖（加糖会睡不着）"}]
      - match: {session: s3, turn: 1}
        reply_text: "已为您点一杯无糖咖啡（您一贯不加糖）。"
  - sample_id: update_multi_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "已更新收货地址为浦东新区张江路 100 号。"
        memory_ops: [{op: set, key: address, value: "收货地址：浦东新区张江路 100 号（已换新，旧信息作废）"}]
      - match: {session: s1, turn: 2}
        reply_text: "已更新手机号为 <PII_PHONE_1>。"
        memory_ops: [{op: set, key: phone, value: "联系电话：<PII_PHONE_1>"}]
      - match: {session: s3, turn: 1}
        reply_text: "订单已按当前信息填写。"
        file_ops: [{op: write, path: 订单.yaml, content: "收货地址: 浦东新区张江路 100 号\n联系电话: <PII_PHONE_1>\n"}]
  - sample_id: update_delayed_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "已记录：6 月 1 日起改用浦东新址。"
        memory_ops: [{op: set, key: address, value: "6 月 1 日起收货地址改为浦东新区张江路 100 号（生效前仍用现地址）"}]
      - match: {session: s2, turn: 1}
        reply_text: "今天是 5 月 20 日，新地址 6 月 1 日才生效，本次订单仍填浦西老地址（文件保持原样）。"
  - sample_id: similar_contacts_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "已记下两位的号码。"
        memory_ops: [{op: set, key: zhangwei, value: "张伟的电话：13800000001"},
                     {op: set, key: lina, value: "李娜的电话：13800000002"}]
      - match: {session: s3, turn: 1}
        reply_text: "会议提醒已写入 短信.yaml，收件人为张伟。"
        file_ops: [{op: write, path: 短信.yaml, content: "收件人: 张伟\n收件人电话: 13800000001\n正文: 会议提醒\n"}]
  - sample_id: similar_drink_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的：早上美式，下午拿铁。"
        memory_ops: [{op: set, key: coffee, value: "早上喝美式，下午才喝另一种咖啡"}]
      - match: {session: s2, turn: 1}
        reply_text: "已按您早上的习惯准备美式咖啡。"
  - sample_id: boundary_temp_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "明白：临时目录只用于这一次，默认目录仍是 输出/。"
        memory_ops: [{op: set, key: export_dir, value: "用户的默认导出目录是 输出/"}]
      - match: {session: s2, turn: 1}
        reply_text: "报告.md 已导出到默认目录 输出/。"
        file_ops: [{op: write, path: 输出/报告.md, content: "# 报告\n内容略\n"}]
  - sample_id: boundary_risk_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的，这次直接删草稿.tmp（仅此一次）。"
        memory_ops: [{op: set, key: del_auth, value: "删除草稿.tmp 是一次性授权（下回仍需确认）"}]
        file_ops: [{op: delete, path: 草稿.tmp}]
      - match: {session: s2, turn: 1}
        reply_text: "上次是仅此一次的授权；备份.tmp 涉及重要数据，需要您确认后再删。"
  - sample_id: boundary_pii_mask_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "已填写申请表，仅用于本次。"
        file_ops: [{op: write, path: 申请表.yaml, content: "姓名: 用户\n身份证号: <PII_ID_1>\n"}]
      - match: {session: s2, turn: 1}
        reply_text: "这份号码我没有留存（不保存敏感信息），下周填表时请您重新提供。"
  - sample_id: reuse_report_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "收到，以后写周报都按此模板。"
        memory_ops: [{op: set, key: report_tpl, value: "用户的周报模板：本周完成/下周计划/风险与求助 三节，以后说写周报就按此格式"}]
      - match: {session: s3, turn: 1}
        reply_text: "已按您的周报模板结合本周素材生成 周报.md。"
        file_ops: [{op: write, path: 周报.md, content: "# 周报（2026-09-21）\n\n## 本周完成\n- 完成接口需求单 v0.2 复核\n- 修复校验器 5 条 P1 缺陷\n\n## 下周计划\n-\n\n## 风险与求助\n- 未决：判官模型族尚未确定\n"}]
  - sample_id: boundary_release_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的，长期记住：快递放南门丰巢。"
        memory_ops: [{op: set, key: express, value: "快递一律放小区南门丰巢"}]
      - match: {session: s3, turn: 1}
        reply_text: "按您的固定偏好，去小区南门丰巢取件。"
  - sample_id: recall_inference_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记住了：女儿小满，下个月满 6 岁。"
        memory_ops: [{op: set, key: family, value: "女儿叫小满，下个月满 6 岁"}]
      - match: {session: s3, turn: 1}
        reply_text: "已为小满挑好 6 岁生日礼物，写进 礼物.md。"
        file_ops: [{op: write, path: 礼物.md, content: "# 给小满的 6 岁生日礼物\n- 《不一样的卡梅拉》注音版绘本\n- 益智积木（适龄 6+）\n"}]
  - sample_id: update_same_session_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "已记录地址。"
        memory_ops: [{op: set, key: address, value: "收货地址：杭州市西湖区文三路 100 号"}]
      - match: {session: s1, turn: 2}
        reply_text: "已按您的更正更新地址。"
        memory_ops: [{op: set, key: address, value: "收货地址：杭州市滨江区江南大道 200 号（用户更正）"}]
      - match: {session: s2, turn: 1}
        reply_text: "已按更正后的滨江地址填写订单。"
        file_ops: [{op: write, path: 订单.yaml, content: "收货地址: 杭州市滨江区江南大道 200 号\n"}]
  - sample_id: similar_desk_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "记下了工位号。"
        memory_ops: [{op: set, key: desk, value: "工位号"}]
      - match: {session: s1, turn: 2}
        reply_text: "好的，现在工位以最新的为准。"
        memory_ops: [{op: set, key: desk, value: "工位 A310（上周调整后的现工位，取快递送工位）"}]
      - match: {session: s2, turn: 1}
        reply_text: "快递地址已写为当前工位。"
        file_ops: [{op: write, path: 快递地址.md, content: "工位：A310\n"}]
  - sample_id: reuse_memory_only_001
    turns:
      - match: {session: s1, turn: 1}
        reply_text: "好的，按亮点/量化/拦路虎三节来。"
        memory_ops: [{op: set, key: report_struct, value: "周报三节：亮点、量化、拦路虎（名字顺序固定）"}]
      - match: {session: s3, turn: 1}
        reply_text: "已按你的三段结构写好周报。"
        file_ops: [{op: write, path: 周报.md, content: "# 周报\n\n## 亮点\n完成 pilot 样本评审与修复。\n\n## 量化\n- 校验器 lint 扩到 21 项\n\n## 拦路虎\n判官模型族尚未确定\n"}]
  - sample_id: similar_campus_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "记下：生产主机 10.10.1.21，备机 10.10.1.27 仅演练用", memory_ops: [{op: set, key: campus, value: "生产巡检主机 10.10.1.21（备机 10.10.1.27 仅演练，平时巡检连主机）"}]}
      - {match: {session: s3, turn: 1}, reply_text: "已填主机", file_ops: [{op: write, path: 巡检.yaml, content: "server: 10.10.1.21\n环境: 生产\n"}]}
  - sample_id: update_route_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "好的", memory_ops: [{op: set, key: route, value: "通勤路线：滨江路"}]}
      - {match: {session: s1, turn: 2}, reply_text: "已更新，之后走望江", memory_ops: [{op: set, key: route, value: "通勤路线：望江路段（滨江路施工，长期绕行）"}]}
      - {match: {session: s2, turn: 1}, reply_text: "明日通勤已填望江", file_ops: [{op: write, path: 通勤.yaml, content: "route: 望江路段\n出发时间: 08:30\n"}]}
  - sample_id: similar_invoice_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "记下母公司抬头与税号", memory_ops: [{op: set, key: invoice, value: "开票抬头：云栖科技有限公司；税号 91330100MA27X8Q123（子公司抬头不用）"}]}
      - {match: {session: s3, turn: 1}, reply_text: "开票信息已填", file_ops: [{op: write, path: 开票.yaml, content: "公司: 云栖科技有限公司\n税号: 91330100MA27X8Q123\n"}]}
  - sample_id: dual_order_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "记下了：免香菜", memory_ops: [{op: set, key: diet, value: "对香菜过敏，点餐备注永远免香菜"}]}
      - {match: {session: s2, turn: 1}, reply_text: "好的，座位偏好记下", memory_ops: [{op: set, key: seat, value: "座位习惯靠窗"}]}
      - {match: {session: s4, turn: 1}, reply_text: "两栏已分别填好", file_ops: [{op: write, path: 订餐.yaml, content: "备注: 免香菜\n座位: 靠窗\n"}]}
  - sample_id: retain_nickname_001
    turns:
      - {match: {session: s1, turn: 1}, reply_text: "好的，以后称呼您阿鹿", memory_ops: [{op: set, key: nickname, value: "称呼用「阿鹿」"}]}
      - {match: {session: s4, turn: 1}, reply_text: "通知已写好", file_ops: [{op: write, path: 通知.md, content: "致 阿鹿：周五 14:00，会议室 B。\n"}]}
