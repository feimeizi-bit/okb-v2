# v2 新题批次 · dynamic_update（DU 核心补位 9/10；第 1 题见 sample-template.yaml）
# 规范：见 sample-template.yaml 头注释（8 条硬检 + E120 约定）
suite_version: "v2.0"
samples:

  - id: v2_du_delay_address_001
    dimension: dynamic_update
    difficulty: L3
    title: 新收货地址下月15号起生效，生效日前不得提前使用
    script:
    - session: s1
      phase: write
      time: 2026-05-28T09:00:00+08:00
      turns:
      - text: 从下个月 15 号起，我的收货地址换成云栖路 5 号。
    - session: s2
      phase: disturb
      time: 2026-06-01T14:00:00+08:00
      turns:
      - text: 帮我润色这句话：会议室已经预订好了。
    - session: s3
      phase: probe
      time: 2026-06-02T10:00:00+08:00
      turns:
      - text: 把地址簿.yaml 里的“当前收货地址”补全，并告诉我现在生效的是哪个地址。
    fixture:
    - path: 地址簿.yaml
      content: "当前收货地址: 江畔路 3 号\n备用地址: \n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆（内容由计划判据判定）
    - id: A2
      type: file_content
      path: 地址簿.yaml
      field_path: 当前收货地址
      content_regex: 江畔路 3 号
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 6/15 前当前地址仍是旧址
      limitation: 旧值保持型断言天然与 fixture 一致（W207 豁免）；区分力由 A3 与计划检查承担
    - id: A3
      type: file_content
      path: 地址簿.yaml
      field_path: 当前收货地址
      content_regex: 云栖路 5 号
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 生效日前不得提前把新址写进“当前”栏
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复（语义在计划层）
    expect:
      verdict: remembered
      reference_answer:
      - 当前收货地址保持江畔路 3 号；回复说明 6/15 起才切换为云栖路 5 号
      gold_evidence:
      - s1.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - 云栖路 5 号
      notes: 提前写入新址=wrongly_reused（A3）；回复无条件称已切换=confused（计划层承接）；未填/未回应=omitted。时间=逻辑时间（faketime）。
      plan_checks:
      - id: R_MEM_WINDOW
        layer: semantic
        scope: memory_after
        requirement: 后态记忆同时支持“当前=江畔路 3 号、6/15 起=云栖路 5 号”；只记新址丢旧址=omitted。
        on_failure: omitted
        basis: s1.t1
      - id: R_FILE_CURRENT
        layer: semantic
        scope: file_after
        requirement: “当前收货地址”字段为江畔路 3 号；6/2 不得出现云栖路 5 号=wrongly_reused。
        on_failure: wrongly_reused
        basis: s1.t1
      - id: R_REPLY_WINDOW
        layer: semantic
        scope: reply
        requirement: 回复说明当前仍用江畔路 3 号、6/15 起切换；无条件称已切换=confused。
        on_failure: confused
        basis: s1.t1,s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      deep_slots: time_anchor
      limitation: 逻辑时间题（faketime）；生效窗口靠夹具日期与脚本时间对齐。

  - id: v2_du_retract_restore_001
    dimension: dynamic_update
    difficulty: L3
    title: 地址说错后撤回，最终回到原值
    script:
    - session: s1
      phase: write
      time: 2026-07-01T10:00:00+08:00
      turns:
      - text: 我的收货地址改成滨江路 7 号。
    - session: s2
      phase: disturb
      time: 2026-07-01T16:00:00+08:00
      turns:
      - text: 刚才说错了——地址不变，滨江路 7 号是同事的；还是柳荫街 12 号。
    - session: s3
      phase: probe
      time: 2026-07-03T09:30:00+08:00
      turns:
      - text: 把通讯录.yaml 的收货地址改成最新的（我确认过，就是现在这个）。
    fixture:
    - path: 通讯录.yaml
      content: "收货地址: 柳荫街 12 号\n手机: 13800000000\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 通讯录.yaml
      field_path: 收货地址
      content_regex: 柳荫街 12 号
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 撤回后当前地址应回到原值
      limitation: 旧值保持型断言天然与 fixture 一致（W207 豁免）；区分力由 A3 与计划检查承担
    - id: A3
      type: file_content
      path: 通讯录.yaml
      field_path: 收货地址
      content_regex: 滨江路 7 号
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 被撤回的地址不得被采用
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 收货地址为柳荫街 12 号；滨江路 7 号是同事的、已撤回
      gold_evidence:
      - s2.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - 滨江路 7 号
      notes: 采用撤回前的新值=wrongly_reused（A3）；未写=omitted；回复称已改为滨江路=confused（计划层）。
      plan_checks:
      - id: R_MEM_RETRACT
        layer: semantic
        scope: memory_after
        requirement: 后态记忆的当前收货地址为柳荫街 12 号；滨江路 7 号如保留必须标注为已撤回/他人地址。
        on_failure: wrongly_reused
        basis: s2.t1
      - id: R_FILE_ADDR
        layer: semantic
        scope: file_after
        requirement: 收货地址字段为柳荫街 12 号；出现滨江路 7 号=wrongly_reused。
        on_failure: wrongly_reused
        basis: s2.t1
      - id: R_REPLY_RETRACT
        layer: semantic
        scope: reply
        requirement: 回复体现“最新要求=柳荫街 12 号”；称已改为滨江路=confused。
        on_failure: confused
        basis: s2.t1,s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 同日内跨会话撤回；无时间算术。

  - id: v2_du_conditional_001
    dimension: dynamic_update
    difficulty: L3
    title: 条件性更新：出差定了，寄件用公司地址
    script:
    - session: s1
      phase: write
      time: 2026-07-10T11:00:00+08:00
      turns:
      - text: 如果下周我去武汉出差，快递就寄到公司（创业大厦 B 座 502）；不去的话寄家里（梧桐巷 9 号）。
    - session: s2
      phase: disturb
      time: 2026-07-12T15:00:00+08:00
      turns:
      - text: 出差定了，去武汉。
    - session: s3
      phase: probe
      time: 2026-07-14T10:00:00+08:00
      turns:
      - text: 把快递单.yaml 的收货地址按最新情况补上。
    fixture:
    - path: 快递单.yaml
      content: "收件人: 许沐\n收货地址: \n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 快递单.yaml
      field_path: 收货地址
      content_regex: 创业大厦 B 座 502
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 条件已触发（出差确定），应为公司地址
    - id: A3
      type: file_content
      path: 快递单.yaml
      field_path: 收货地址
      content_regex: 梧桐巷 9 号
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 条件触发后不得仍用家里地址
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 收货地址为创业大厦 B 座 502（条件已触发）
      gold_evidence:
      - s1.t1
      - s2.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - 梧桐巷 9 号
      notes: 条件判定错误=wrongly_reused（A3）；写两个并列表述=confused（计划层）；未填=omitted。
      plan_checks:
      - id: R_MEM_CONDITION
        layer: semantic
        scope: memory_after
        requirement: 后态记忆支持“出差→公司地址；不出差→家庭地址”的条件与已触发结论。
        on_failure: omitted
        basis: s1.t1,s2.t1
      - id: R_FILE_CONDITION
        layer: semantic
        scope: file_after
        requirement: 收货地址=创业大厦 B 座 502；出现梧桐巷 9 号=wrongly_reused。
        on_failure: wrongly_reused
        basis: s2.t1
      - id: R_REPLY_CONDITION
        layer: semantic
        scope: reply
        requirement: 回复给出公司地址并体现条件已满足；罗列两个地址不作抉择=confused。
        on_failure: confused
        basis: s1.t1,s2.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 条件触发在 s2 明示；无时间算术。

  - id: v2_du_version_rollback_001
    dimension: dynamic_update
    difficulty: L3
    title: 模板升级后回退，当前版本回到 v1
    script:
    - session: s1
      phase: write
      time: 2026-07-20T09:00:00+08:00
      turns:
      - text: 周报模板升级到 v2 了，新增“数据指标”一节。
    - session: s2
      phase: disturb
      time: 2026-07-22T14:00:00+08:00
      turns:
      - text: 算了，评审后还是用回 v1，v2 先不用。
    - session: s3
      phase: probe
      time: 2026-07-24T10:00:00+08:00
      turns:
      - text: 把 周报模板.md 的标题行改成“周报模板（当前版）”，其余保持当前约定。
    fixture:
    - path: 周报模板.md
      content: "# 周报模板（v1）\n## 本周完成\n## 下周计划\n## 风险\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 周报模板.md
      content_regex: 数据指标
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 回退后不得把 v2 的内容写回文件
    - id: A3
      type: file_content
      path: 周报模板.md
      content_regex: 当前版
      expect: present
      severity: hard
      on_violation: omitted
      desc: 标题已按需求更新
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 当前模板为 v1；文件标题更新为“周报模板（当前版）”，不包含“数据指标”一节
      gold_evidence:
      - s1.t1
      - s2.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - 数据指标
      notes: 按 v2 更新文件=wrongly_reused（A2）；未改标题=omitted（A3）；回复称用 v2=confused（计划层）。
      plan_checks:
      - id: R_MEM_VERSION
        layer: semantic
        scope: memory_after
        requirement: 后态记忆的当前模板版本=v1（v2 已弃用）。
        on_failure: wrongly_reused
        basis: s2.t1
      - id: R_FILE_VERSION
        layer: semantic
        scope: file_after
        requirement: 文件不含“数据指标”节；标题含“当前版”。
        on_failure: wrongly_reused
        basis: s2.t1,s3.t1
      - id: R_REPLY_VERSION
        layer: semantic
        scope: reply
        requirement: 回复依据 v1 约定；称使用 v2=confused。
        on_failure: confused
        basis: s2.t1,s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 版本回退语义；无时间算术。

  - id: v2_du_cross_session_chain_001
    dimension: dynamic_update
    difficulty: L3
    title: 环境跨会话连改两次，最终以 uat 为准
    script:
    - session: s1
      phase: write
      time: 2026-07-25T10:00:00+08:00
      turns:
      - text: 项目环境从 dev 改成 staging。
    - session: s2
      phase: disturb
      time: 2026-07-26T11:00:00+08:00
      turns:
      - text: 环境再改一下，从 staging 换成 uat 吧。
    - session: s3
      phase: probe
      time: 2026-07-27T09:00:00+08:00
      turns:
      - text: 把 项目配置.yaml 的环境更新到最新。
    fixture:
    - path: 项目配置.yaml
      content: "环境: dev\n版本: 1.0.0\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 项目配置.yaml
      field_path: 环境
      content_regex: uat
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 最终生效值为 uat
    - id: A3
      type: file_content
      path: 项目配置.yaml
      field_path: 环境
      content_regex: dev|staging
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 旧环境名不得残留
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 环境=uat；dev 与 staging 均已废弃
      gold_evidence:
      - s1.t1
      - s2.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - staging
      notes: 停在中间值 staging 或更旧 dev=wrongly_reused（A3）；未更新=omitted。
      plan_checks:
      - id: R_MEM_CHAIN
        layer: semantic
        scope: memory_after
        requirement: 后态记忆当前环境=uat；历史 dev/staging 如需保留须标注已废弃。
        on_failure: wrongly_reused
        basis: s2.t1
      - id: R_FILE_CHAIN
        layer: semantic
        scope: file_after
        requirement: 环境字段=uat；出现 dev/staging=wrongly_reused。
        on_failure: wrongly_reused
        basis: s2.t1,s3.t1
      - id: R_REPLY_CHAIN
        layer: semantic
        scope: reply
        requirement: 回复确认最新环境=uat；称 staging/dev=confused。
        on_failure: confused
        basis: s2.t1,s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 连续两次更新链；无时间算术。

  - id: v2_du_adjacent_field_001
    dimension: dynamic_update
    difficulty: L3
    title: 手机号更新，不得串写到座机字段
    script:
    - session: s1
      phase: write
      time: 2026-08-01T10:00:00+08:00
      turns:
      - text: 我的手机号换成 18911112222 了。
    - session: s2
      phase: disturb
      time: 2026-08-02T09:00:00+08:00
      turns:
      - text: 帮我润色：这个方案我晚上再确认。
    - session: s3
      phase: probe
      time: 2026-08-03T10:00:00+08:00
      turns:
      - text: 把通讯录.yaml 的手机号更新成最新的，其他字段别动。
    fixture:
    - path: 通讯录.yaml
      content: "手机: 13900000000\n座机: 010-88886666\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 通讯录.yaml
      field_path: 手机
      content_regex: 18911112222
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 手机字段=新号
    - id: A3
      type: file_content
      path: 通讯录.yaml
      field_path: 座机
      content_regex: 18911112222
      expect: absent
      severity: hard
      on_violation: confused
      evaluate_at: snapshot_after
      desc: 新手机号不得出现在座机字段（串台）
    - id: A4
      type: file_content
      path: 通讯录.yaml
      field_path: 座机
      content_regex: "010-88886666"
      expect: present
      severity: hard
      on_violation: omitted
      desc: 座机字段保持原值
      limitation: 旧值保持型断言天然与 fixture 一致（W207 豁免）
    - id: A5
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 手机=18911112222；座机=010-88886666 保持不变
      gold_evidence:
      - s1.t1
      confusions:
      - omitted
      - confused
      - wrongly_reused
      trap:
      - "18911112222"
      notes: 把新号写进座机=confused（A3 承接，on_violation=confused）；手机仍是旧号=wrongly_reused（A2 未满足）。
      plan_checks:
      - id: R_MEM_PHONE
        layer: semantic
        scope: memory_after
        requirement: 后态记忆手机号=18911112222；座机保持 010-88886666。
        on_failure: wrongly_reused
        basis: s1.t1
      - id: R_FILE_CROSSTALK
        layer: semantic
        scope: file_after
        requirement: 手机字段=新号、座机字段=原座机；串写=confused。
        on_failure: confused
        basis: s1.t1,s3.t1
      - id: R_REPLY_FIELDS
        layer: semantic
        scope: reply
        requirement: 回复体现只更新手机号；提及座机变更=confused。
        on_failure: confused
        basis: s3.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 相邻字段防串台；无时间算术。

  - id: v2_du_repeat_correction_001
    dimension: dynamic_update
    difficulty: L3
    title: 更正再作废，限行日最终回到周四
    script:
    - session: s1
      phase: write
      time: 2026-08-03T10:00:00+08:00
      turns:
      - text: 我的限行日是周四。
    - session: s2
      phase: disturb
      time: 2026-08-04T10:00:00+08:00
      turns:
      - text: 更正一下，是周三，不是周四。
    - session: s3
      phase: disturb
      time: 2026-08-05T10:00:00+08:00
      turns:
      - text: 我又看了一遍日历，还是周四——刚才那次更正作废。
    - session: s4
      phase: probe
      time: 2026-08-06T10:00:00+08:00
      turns:
      - text: 把 车辆信息.yaml 的限行日填上当前正确的。
