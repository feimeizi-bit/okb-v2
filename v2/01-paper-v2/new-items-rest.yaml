# v2 新题批次 · 其余维度（LTR 3 / MR 5 / SD 1 / BR 3 / TR 2）
# 规范：见 sample-template.yaml 头注释（8 条硬检 + E120 约定）
suite_version: "v2.0"
samples:

  - id: v2_ltr_deepchain_allergy_001
    dimension: long_term_retention
    difficulty: L3
    title: 长干扰链后仍能按忌口调整清单
    tags: [strong_disturb]
    script:
    - session: s1
      phase: write
      turns:
      - text: 我对葵花粉过敏，帮我记住，点心和饮品都要避开。
    - session: s2
      phase: disturb
      turns:
      - text: 帮我润色：下周的评审材料准备得差不多了。
    - session: s3
      phase: disturb
      turns:
      - text: 帮我查一下明天限行吗？车牌尾号 3。
    - session: s4
      phase: disturb
      turns:
      - text: 把这句话翻译一下：时间就是金钱。
    - session: s5
      phase: probe
      turns:
      - text: 把 下午茶清单.md 里我不能吃的删掉，备注写“已按忌口调整”。
    fixture:
    - path: 下午茶清单.md
      content: "# 下午茶清单\n- 桂花糕\n- 葵花籽曲奇\n- 碧螺春\n- 原味曲奇\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 下午茶清单.md
      content_regex: 葵花籽曲奇
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 含过敏原的条目必须被删除
    - id: A3
      type: file_content
      path: 下午茶清单.md
      content_regex: 已按忌口调整
      expect: present
      severity: hard
      on_violation: omitted
      desc: 备注按任务要求写入
    - id: A4
      type: reply_text
      turn: s5.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 删除“葵花籽曲奇”并写入备注；过敏信息跨 4 个话题会话仍生效
      gold_evidence:
      - s1.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - 葵花籽曲奇
      notes: 未删过敏原=wrongly_reused（A2）；漏备注=omitted；对过敏范围误判（连桂花糕也删）=confused（计划层）。
      plan_checks:
      - id: R_MEM_ALLERGY
        layer: semantic
        scope: memory_after
        requirement: 后态记忆保留“葵花粉过敏、点心饮品都要避开”。
        on_failure: omitted
        basis: s1.t1
      - id: R_FILE_REMOVE
        layer: semantic
        scope: file_after
        requirement: 清单中删除含葵花籽的条目；保留其他条目。
        on_failure: wrongly_reused
        basis: s1.t1,s5.t1
      - id: R_TASK_NOTE
        layer: semantic
        scope: file_after
        requirement: 备注包含“已按忌口调整”。
        on_failure: omitted
        basis: s5.t1
      - id: R_SCOPE_CONF
        layer: semantic
        scope: reply
        requirement: 回复仅将真正的过敏原条目（含葵花成分）列为不可用、保留非过敏原条目=supported；把非过敏原条目也算作不可用=contradicted（计入混淆）。
        on_failure: confused
        basis: s1.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 强扰动槽（写探间 3 个不同话题会话）。

  - id: v2_ltr_dual_card_binding_001
    dimension: long_term_retention
    difficulty: L3
    title: 两张银行卡各绑定用途，不得混用
    script:
    - session: s1
      phase: write
      turns:
      - text: 我有两张卡：招行尾号 3344 用于报销；交行尾号 7788 用于出差。
    - session: s2
      phase: disturb
      turns:
      - text: 帮我润色：预算表下午发你。
    - session: s3
      phase: probe
      turns:
      - text: 把 报销信息.yaml 的收款卡尾号填上。
    fixture:
    - path: 报销信息.yaml
      content: "收款卡尾号: \n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 报销信息.yaml
      field_path: 收款卡尾号
      content_regex: "3344"
      expect: present
      severity: hard
      on_violation: omitted
      desc: 报销场景应使用招行卡尾号 3344
    - id: A3
      type: file_content
      path: 报销信息.yaml
      field_path: 收款卡尾号
      content_regex: "7788"
      expect: absent
      severity: hard
      on_violation: confused
      evaluate_at: snapshot_after
      desc: 出差卡尾号不得用于报销场景
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 收款卡尾号=3344（招行，报销用途）
      gold_evidence:
      - s1.t1
      confusions:
      - omitted
      - confused
      trap:
      - "7788"
      notes: 误用出差卡=confused（A3 承接）；未填=omitted。
      plan_checks:
      - id: R_MEM_CARDS
        layer: semantic
        scope: memory_after
        requirement: 后态记忆两卡用途绑定（3344→报销；7788→出差）。
        on_failure: omitted
        basis: s1.t1
      - id: R_FILE_CARD
        layer: semantic
        scope: file_after
        requirement: 收款卡尾号=3344；出现 7788=confused。
        on_failure: confused
        basis: s1.t1
      - id: R_REPLY_CARD
        layer: semantic
        scope: reply
        requirement: 回复解释选择招行卡的原因；称出差卡=confused。
        on_failure: confused
        basis: s1.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 双值用途绑定；仅 omitted/confused 面。

  - id: v2_ltr_late_workspot_001
