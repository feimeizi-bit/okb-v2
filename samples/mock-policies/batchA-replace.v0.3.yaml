policy_version: 1
tier: replace
suite_version: v0.3
on_missing_record: fail
defaults:
  reply_text: 好的。
samples:
- sample_id: update_invoice_title_001
  turns:
  - match:
      session: s1
      turn: 1
    reply_text: 收到。
    memory_ops:
    - op: set
      key: invoice_title
      value: 上海启成信息技术有限公司
  - match:
      session: s2
      turn: 1
    reply_text: 好的，旧的作废。
    memory_ops:
    - op: set
      key: invoice_title
      value: 上海启成数字科技有限公司
  - match:
      session: s4
      turn: 1
    reply_text: 按最新抬头写入。
    file_ops:
    - op: write
      path: 开票须知.md
      content: '# 开票须知

        - 抬头：上海启成数字科技有限公司

        '
- sample_id: similar_wifi_001
  turns:
  - match:
      session: s1
      turn: 1
    reply_text: 记下。
    memory_ops:
    - op: set
      key: wifi_home
      value: Jia2026home
  - match:
      session: s1
      turn: 2
    reply_text: 公司那条也记下。
    memory_ops:
    - op: set
      key: wifi_office
      value: Yue2026office
  - match:
      session: s5
      turn: 1
    reply_text: 好了。
    file_ops:
    - op: write
      path: 网络指引.md
      content: '# 网络指引

        - SSID: QC-Office

        - 密码: Yue2026office

        '
- sample_id: retain_pet_name_001
  turns:
  - match:
      session: s1
      turn: 1
    reply_text: 好的。
    memory_ops:
    - op: set
      key: cat
      value: 芝麻
  - match:
      session: s3
      turn: 1
    reply_text: 好了。
    file_ops:
    - op: write
      path: 采购.md
      content: '# 猫粮采购

        - 适用：芝麻

        '
- sample_id: boundary_temp_path_001
  turns:
  - match:
      session: s1
      turn: 1
    reply_text: 明白。
  - match:
      session: s3
      turn: 1
    reply_text: 写好。
    file_ops:
    - op: write
      path: 部署配置.yaml
      content: 'port: 8080

        log_dir: logs/

        '
- sample_id: reuse_buglist_two_step_001
  turns:
  - match:
      session: s1
      turn: 1
    reply_text: 收到格式。
    memory_ops:
    - op: set
      key: bugfmt
      value: BUG-编号 | 严重度=高|中|低 | 负责人
  - match:
      session: s3
      turn: 1
    reply_text: 好了。
    file_ops:
    - op: write
      path: 缺陷列表.md
      content: 'BUG-1042 | 严重度=高 | 老王

        BUG-1043 | 严重度=中 | 小李

        '
    - op: write
      path: 周报附录.md
      content: '- BUG-1043 | 严重度=中 | 小李

        '
