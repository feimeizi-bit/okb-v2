    fixture:
    - path: 排班表.md
      content: "# 排班表（2025 版）\n- 标准工时: 8 小时\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 排班表.md
      content_regex: 7.5 小时
      expect: present
      severity: hard
      on_violation: wrongly_reused
      desc: 新口径 7.5 小时已写入
    - id: A3
      type: file_content
      path: 排班表.md
      content_regex: "8 小时"
      expect: absent
      severity: hard
      on_violation: wrongly_reused
      evaluate_at: snapshot_after
      desc: 旧值 8 小时不得残留
    - id: A4
      type: reply_text
      turn: s3.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 标准工时=7.5 小时，旧值 8 小时作废
      gold_evidence:
      - s1.t1
      confusions:
      - omitted
      - wrongly_reused
      trap:
      - "8 小时"
      notes: 沿用工作区旧值=wrongly_reused（A3 承接）；未更新=omitted。
      plan_checks:
