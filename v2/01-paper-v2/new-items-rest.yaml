      - text: 先记一条：我平时用蓝色笔。
    - session: s2
      phase: disturb
      turns:
      - text: 今天天气不错。
    - session: s3
      phase: update
      turns:
      - text: 对了，我的工位是 A 区 12 号。
    - session: s4
      phase: probe
      turns:
      - text: 把 签到表.yaml 的工位号填上。
    fixture:
    - path: 签到表.yaml
      content: "姓名: 许沐\n工位号: \n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 签到表.yaml
      field_path: 工位号
      content_regex: A 区 12 号
      expect: present
      severity: hard
      on_violation: omitted
      desc: 工位号已正确填写
    - id: A3
      type: reply_text
      turn: s4.t1
      regex: .+
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：探测轮有非空回复
    expect:
      verdict: remembered
      reference_answer:
      - 工位号=A 区 12 号
      gold_evidence:
      - s3.t1
      confusions:
      - omitted
      notes: 后段写入信息保持；本题仅 omitted 面（无错误值面）。
      plan_checks:
      - id: R_MEM_SPOT
        layer: semantic
        scope: memory_after
        requirement: 后态记忆保留工位=A 区 12 号。
        on_failure: omitted
        basis: s3.t1
      - id: R_FILE_SPOT
        layer: semantic
        scope: file_after
        requirement: 工位号字段=A 区 12 号。
        on_failure: omitted
        basis: s3.t1,s4.t1
    score_policy: hybrid
    meta:
      author: A-side v2 (draft)
      created: "2026-10-09"
      source: handcrafted
      limitation: 仅 omitted 形态（无错误值面），confused/wr 不适用。

