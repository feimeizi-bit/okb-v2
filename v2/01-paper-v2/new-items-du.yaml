      content: "限行日: \n保险到期: 2027-01-01\n"
    anchors:
    - id: A1
      type: memory_entry
      key_regex: .*
      expect: present
      severity: hard
      on_violation: omitted
      desc: 结构护栏：后态存在至少一条持久记忆
    - id: A2
      type: file_content
      path: 车辆信息.yaml
      field_path: 限行日
      content_regex: 周四
      expect: present
      severity: hard
      on_violation: wrongly_reused
